[package]
name = "private-code-desktop"
version = "0.1.0"
edition = "2021"

publish = false
[dependencies]
private-code-core = { path = "../../../crates/core" }
private-code-protocol = { path = "../../../crates/protocol" }
private-code-providers = { path = "../../../crates/providers" }
private-code-tools = { path = "../../../crates/tools" }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"

[dev-dependencies]
# Providers testkit (ScriptedProvider / SSE replay) for webview-free EngineState
# tests; tempfile for temp DBs and git workspaces.
private-code-providers = { path = "../../../crates/providers", features = ["testkit"] }
tempfile = "3"
async-trait = "0.1"
# `test` exposes tauri::test::mock_app + MockRuntime so the command layer can be
# driven headless (no webview) over a managed SessionCoordinator.
tauri = { version = "2", features = ["test"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
name = "private_code_desktop"
crate-type = ["lib", "cdylib", "staticlib"]
