# cargo-deny configuration.
#
# NOTE: do NOT copy cargo-deny's upstream template — its [bans] forbids git2,
# openssl, and libssh2, all of which this tree legitimately depends on (git2 is
# the checkpoint write engine; reqwest/libgit2-sys pull the openssl/ssh chain on
# Linux). multiple-versions is `warn`, not `deny`: a tree with tokio/sqlx/reqwest/
# axum/tauri always has duplicate minor versions, so `deny` would be a permanent
# red gate.

[graph]
all-features = false
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
version = 2
# Every id below is an UNMAINTAINED/UNSOUND informational advisory on a
# transitive dependency we do not control and cannot upgrade away without a
# major bump of tauri or ratatui. None is an exploitable vulnerability. Real
# vulnerabilities are fixed at the source instead (git2 -> 0.20 patched
# RUSTSEC-2026-0008; the rsa Marvin-attack crate is an inactive optional dep of
# sqlx-mysql, a driver we never enable, so it is never compiled).
ignore = [
    # --- Tauri's Linux GTK3 stack: the entire gtk-rs GTK3 family is EOL
    #     (the ecosystem moved to gtk4). Pulled only on Linux via webkit2gtk. ---
    "RUSTSEC-2024-0411", # gdkwayland-sys
    "RUSTSEC-2024-0412", # gdk
    "RUSTSEC-2024-0413", # atk
    "RUSTSEC-2024-0414", # gdkx11-sys
    "RUSTSEC-2024-0415", # gtk
    "RUSTSEC-2024-0416", # atk-sys
    "RUSTSEC-2024-0417", # gdkx11
    "RUSTSEC-2024-0418", # gdk-sys
    "RUSTSEC-2024-0419", # gtk3-macros
    "RUSTSEC-2024-0420", # gtk-sys
    "RUSTSEC-2024-0429", # glib (unsound VariantStrIter; same GTK3 stack)
    # --- rust-unic family (unmaintained), via tauri -> tauri-utils -> urlpattern ---
    "RUSTSEC-2025-0075", # unic-char-range
    "RUSTSEC-2025-0080", # unic-common
    "RUSTSEC-2025-0081", # unic-char-property
    "RUSTSEC-2025-0098", # unic-ucd-version
    "RUSTSEC-2025-0100", # unic-ucd-ident
    # --- Old proc-macro / utility crates (unmaintained), pulled transitively ---
    "RUSTSEC-2024-0370", # proc-macro-error
    "RUSTSEC-2024-0388", # derivative
    "RUSTSEC-2024-0384", # instant
    "RUSTSEC-2024-0436", # paste
    # --- lru (unsound), via ratatui 0.26; fix needs a ratatui major bump ---
    "RUSTSEC-2026-0002", # lru
]

[licenses]
version = 2
confidence-threshold = 0.9
# Our own workspace crates are `publish = false`; they carry the project's
# Apache-2.0 license (allowed below) and are skipped here as private crates.
private = { ignore = true }
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "MPL-2.0",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "MIT-0",
    "OpenSSL",
]
# Third-party crates with no SPDX field, pinned after running cargo-deny once.
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "warn"
allow-wildcard-paths = true
# Do NOT ban git2/openssl/libssh2 — they are required here.
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
