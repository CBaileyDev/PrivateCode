[workspace]
members = [
    "crates/*",
    "cli",
    "apps/desktop/src-tauri",
]
resolver = "2"

[workspace.dependencies]
private-code-core = { path = "crates/core" }
private-code-protocol = { path = "crates/protocol" }
private-code-providers = { path = "crates/providers" }
private-code-tools = { path = "crates/tools" }
private-code-tui = { path = "crates/tui" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json", "stream"] }
git2 = "0.20"
ratatui = "0.26"
crossterm = "0.28"
keyring = "2"
ignore = "0.4"
nucleo = "0.5"
similar = "2.5"
thiserror = "1"
color-eyre = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }
futures-util = "0.3"
eventsource-stream = "0.2"
url = "2"
ipnetwork = "0.20"
dns-lookup = "2.0"
json_comments = "0.2"
schemars = "0.8"
async-trait = "0.1"
tempfile = "3"
globset = "0.4"
chrono = { version = "0.4", features = ["serde"] }
axum = { version = "0.7", features = ["ws", "macros"] }
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
tokio-tungstenite = "0.21"
http = "1"


