[package]
name = "private-code-providers"
version = "0.1.0"
edition = "2024"

publish = false
[dependencies]
private-code-protocol.workspace = true
tokio.workspace = true
reqwest.workspace = true
eventsource-stream.workspace = true
futures-util.workspace = true
keyring.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
async-trait.workspace = true

[features]
# Offline test doubles (ScriptedProvider, SSE replay). Off by default so they
# never ship in release builds; enabled for this crate's own tests via the
# self dev-dependency below, and by downstream crates' dev-dependencies.
testkit = []

[dev-dependencies]
private-code-providers = { path = ".", features = ["testkit"] }
tokio = { workspace = true }
criterion.workspace = true

[[bench]]
name = "parse_anthropic"
harness = false

